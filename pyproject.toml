[project]
name = "my-python-service"
version = "0.1.0"
description = "Next.js code review MCP service with GitLab MR integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
